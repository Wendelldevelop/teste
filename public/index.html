<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Agendamento com Pagamento</title>
</head>
<body>
  <h1>Agendar Horário</h1>

  <form id="form-agendamento">
    <div>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>
    </div>

    <div>
      <label for="data">Data:</label>
      <select id="data" name="data" required>
        <option value="2026-09-19">19/09/2026</option>
        <option value="2026-09-20">20/09/2026</option>
        <option value="2026-09-21">21/09/2026</option>
        <option value="2026-09-22">22/09/2026</option>
      </select>
    </div>

    <div id="formas-pagamento">
      <p>Forma de pagamento:</p>
    </div>

    <button type="submit">Agendar</button>
  </form>

  <p id="resultado"></p>

  <script>
    const formasPagamentoDiv = document.getElementById('formas-pagamento');
    const form = document.getElementById('form-agendamento');
    const resultado = document.getElementById('resultado');

    fetch('/api/empresas/1/payment-methods')
      .then((res) => res.json())
      .then((formas) => {
        formas.forEach((forma, index) => {
          const label = document.createElement('label');
          const input = document.createElement('input');
          input.type = 'radio';
          input.name = 'formaPagamento';
          input.value = forma.id;
          if (index === 0) input.checked = true;

          label.appendChild(input);
          label.appendChild(document.createTextNode(' ' + forma.nome));
          formasPagamentoDiv.appendChild(label);
        });
      });

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const nome = document.getElementById('nome').value;
      const data = document.getElementById('data').value;
      const formaPagamento = form.querySelector('input[name="formaPagamento"]:checked').value;

      fetch('/api/agendamentos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, data, formaPagamento }),
      })
        .then((res) => res.json())
        .then((resposta) => {
          resultado.textContent = resposta.mensagem || resposta.erro;
        });
    });
  </script>
</body>
</html>
